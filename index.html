<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼周末 · 大学生周末兼职撮合</title>
<style>
  :root{
    /* 美团黄体系 (实测色值) */
    --y-pale:#FFFBE6;
    --y-light:#FFF8CC;
    --y-mid:#FFE366;
    --y-core:#FFD100;
    --y-deep:#FFC300;
    --ink:#111925;
    --ink-65:rgba(17,25,37,.65);
    --ink-45:rgba(17,25,37,.45);
    --ink-20:rgba(17,25,37,.2);
    --border:#E7E8E9;
    --bg:#F7F8F9;
    --card:#FFFFFF;
    --red:#EE3F3F;
    --green:#00A870;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
    font-size:14px;
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:var(--ink);
    padding:0 20px;
    padding-top:env(safe-area-inset-top,0px);
    border-bottom:3px solid var(--y-core);
  }
  .header-inner{
    display:flex; align-items:center; justify-content:space-between;
    height:56px; max-width:1200px; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    background:var(--y-core); color:var(--ink); font-weight:800; font-size:16px;
    padding:5px 10px; border-radius:6px; letter-spacing:1px;
  }
  .campus-switch{
    background:transparent; border:none; color:#fff; font-size:13px; font-weight:600;
    font-family:inherit; cursor:pointer; padding:4px 0;
  }
  .campus-switch option{color:var(--ink);}
  nav.role-switch{display:flex; gap:4px; background:rgba(255,255,255,.08); padding:3px; border-radius:999px;}
  nav.role-switch button{
    border:none; background:transparent; color:rgba(255,255,255,.7);
    padding:7px 18px; font-size:13px; cursor:pointer; border-radius:999px;
    font-family:inherit; font-weight:600;
  }
  nav.role-switch button.active{background:var(--y-core); color:var(--ink);}

  main{max-width:1200px; margin:0 auto; padding:0 18px 60px;}

  /* ---------- Hero band (yellow) ---------- */
  .hero-band{
    background:linear-gradient(135deg,var(--y-core) 0%,var(--y-mid) 100%);
    margin:0 -18px 0; padding:26px 18px 20px;
  }
  .hero-band-inner{max-width:1200px; margin:0 auto;}
  .hero-band h1{
    font-size:clamp(20px,3.2vw,27px); line-height:1.4; margin:0 0 6px; font-weight:800; color:var(--ink);
  }
  .hero-band p{margin:0 0 16px; color:var(--ink-65); font-size:13.5px;}
  .stat-row{display:flex; gap:24px;}
  .stat-row div b{display:block; font-size:20px; font-weight:800; color:var(--ink);}
  .stat-row div span{font-size:11.5px; color:var(--ink-65);}

  /* ---------- Quick category grid (金刚区) ---------- */
  .cat-grid{
    display:grid; grid-template-columns:repeat(6,1fr); gap:0;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    margin-top:-14px; padding:14px 6px 6px; position:relative; z-index:2;
    box-shadow:0 2px 8px rgba(17,25,37,.06);
  }
  @media (max-width:700px){ .cat-grid{grid-template-columns:repeat(3,1fr);} }
  .cat-item{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:8px 4px 12px; cursor:pointer; border:none; background:none; font-family:inherit;
  }
  .cat-item .ic{
    width:42px; height:42px; border-radius:12px; background:var(--y-pale);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .cat-item.active .ic{background:var(--y-core);}
  .cat-item span{font-size:12px; color:var(--ink-65); font-weight:500;}
  .cat-item.active span{color:var(--ink); font-weight:700;}

  /* ---------- Layout ---------- */
  .view{display:none;}
  .view.active{display:block;}
  .cols{display:grid; grid-template-columns:236px 1fr; gap:18px; margin-top:18px;}
  @media (max-width:760px){ .cols{grid-template-columns:1fr;} }

  .filter-box{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; align-self:start; position:sticky; top:74px;
  }
  .filter-box h3{margin:0 0 12px; font-size:13px; color:var(--ink); font-weight:700;}
  .filter-group{margin-bottom:14px;}
  .filter-group label{display:block; font-size:12px; color:var(--ink-45); margin-bottom:6px; font-weight:500;}
  .filter-group select, .filter-group input{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px;
    font-size:13px; background:var(--bg); font-family:inherit; color:var(--ink);
  }
  .filter-group select:focus, .filter-group input:focus{outline:2px solid var(--y-core); outline-offset:-1px;}

  /* ---------- Job cards ---------- */
  .list-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .list-header #jobCount{font-size:13px; color:var(--ink-45); font-weight:500;}
  .list-header select{
    border:1px solid var(--border); border-radius:6px; padding:6px 10px;
    font-size:12.5px; background:var(--card); font-family:inherit; color:var(--ink);
  }
  .list-header select:focus{outline:2px solid var(--y-core); outline-offset:-1px;}
  .job-list{display:flex; flex-direction:column; gap:10px;}
  .job-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; display:flex; gap:14px; align-items:center;
    transition:border-color .15s;
  }
  .job-card:hover{border-color:var(--y-deep);}
  .job-card .info{flex:1; min-width:0;}
  .job-card .title-row{display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap;}
  .job-card h4{margin:0; font-size:15px; font-weight:700;}
  .urgent-pill{
    background:var(--y-pale); color:var(--red); border:1px solid #FFE0E0; background:#FFF0F0;
    font-size:10.5px; padding:1px 7px; border-radius:4px; font-weight:700;
  }
  .job-meta{display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--ink-45); margin-bottom:6px;}
  .job-meta span{display:flex; align-items:center; gap:3px;}
  .job-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag-pill{
    background:var(--bg); color:var(--ink-65); border:1px solid var(--border); border-radius:4px; padding:2px 8px; font-size:11px;
  }
  .shop-line{font-size:11.5px; color:var(--ink-45); margin-top:5px;}
  .job-card .side{text-align:right; min-width:104px; display:flex; flex-direction:column; align-items:flex-end; gap:8px;}
  .job-card .pay b{font-size:20px; color:var(--red); font-weight:800;}
  .job-card .pay .u{font-size:11px; color:var(--ink-45);}
  button.apply{
    background:var(--y-core); color:var(--ink); border:none; border-radius:999px;
    padding:8px 18px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;
    white-space:nowrap;
  }
  button.apply:hover{background:var(--y-deep);}
  button.apply:disabled{background:var(--border); color:var(--ink-45); cursor:default;}

  /* ---------- Forms ---------- */
  .panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-top:18px;}
  .panel h3{margin-top:0; font-size:15px; color:var(--ink); font-weight:800;
    border-left:4px solid var(--y-core); padding-left:10px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
  .form-grid .full{grid-column:1/-1;}
  @media (max-width:600px){ .form-grid{grid-template-columns:1fr;} }
  .field label{display:block; font-size:12px; color:var(--ink-45); margin-bottom:5px; font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:6px;
    font-size:13.5px; font-family:inherit; background:var(--bg); color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--y-core); outline-offset:-1px;}
  .field textarea{resize:vertical; min-height:64px;}
  .submit-btn{
    margin-top:16px; background:var(--y-core); color:var(--ink); border:none; border-radius:999px;
    padding:11px 26px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .submit-btn:hover{background:var(--y-deep);}

  .section-title{
    font-size:14px; color:var(--ink); font-weight:800; margin:24px 0 10px;
    border-left:4px solid var(--y-core); padding-left:10px;
  }

  .posted-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
  .posted-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .applicant-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-top:1px dashed var(--border); font-size:13px;
  }
  .status-pill{font-size:11px; padding:3px 10px; border-radius:999px; font-weight:700;}
  .status-pending{background:var(--y-pale); color:#A66E00;}
  .status-confirmed{background:#E5F7EF; color:var(--green);}
  .confirm-btn{
    border:none; color:var(--ink); background:var(--y-core); border-radius:999px;
    padding:5px 14px; font-size:12px; cursor:pointer; font-family:inherit; font-weight:700;
  }
  .confirm-btn:hover{background:var(--y-deep);}

  .empty{color:var(--ink-45); font-size:13px; padding:24px; text-align:center; border:1px dashed var(--border); border-radius:var(--radius); background:var(--card);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 20px; border-radius:8px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  footer{text-align:center; color:var(--ink-45); font-size:11.5px; padding:26px 0 10px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="mark">拼周末</span>
      <select id="campusSwitch" class="campus-switch" onchange="onCampusChange()">
        <option value="Monash University · Clayton">📍 Monash · Clayton</option>
        <option value="Monash University · Caulfield">📍 Monash · Caulfield</option>
        <option value="University of Melbourne · Parkville">📍 Unimelb · Parkville</option>
        <option value="RMIT University · City">📍 RMIT · City</option>
        <option value="Deakin University · Burwood">📍 Deakin · Burwood</option>
        <option value="La Trobe University · Bundoora">📍 La Trobe · Bundoora</option>
      </select>
    </div>
    <nav class="role-switch">
      <button id="btnStudent" class="active" onclick="setRole('student')">我是学生</button>
      <button id="btnShop" onclick="setRole('shop')">我是商家</button>
    </nav>
  </div>
</header>

<main>

  <!-- ============ STUDENT VIEW ============ -->
  <section id="view-student" class="view active">

    <div class="hero-band">
      <div class="hero-band-inner">
        <h1>周末想赚生活费？附近商家正缺人手</h1>
        <p>已定位到你的校区，按周末/周内、时长、时薪筛选短工，一键报名</p>
        <div class="stat-row">
          <div><b id="statJobs">-</b><span>在招岗位</span></div>
          <div><b id="statShops">-</b><span>合作商家</span></div>
        </div>
      </div>
    </div>

    <div class="cat-grid" id="catGrid"></div>

    <div class="cols">
      <aside class="filter-box">
        <h3>筛选条件</h3>
        <div class="filter-group">
          <label>工作日期</label>
          <select id="fPeriod" onchange="renderJobs()">
            <option value="">不限</option>
            <option value="周末">周末</option>
            <option value="周内">周内</option>
          </select>
        </div>
        <div class="filter-group">
          <label>每天可上班时长</label>
          <select id="fHours" onchange="renderJobs()">
            <option value="">不限</option>
            <option value="2">2小时以内</option>
            <option value="4">2-4小时</option>
            <option value="6">4-6小时</option>
            <option value="99">6小时以上</option>
          </select>
        </div>
        <div class="filter-group">
          <label>最低时薪 (AUD)</label>
          <input id="fPay" type="number" placeholder="例如 28" oninput="renderJobs()">
        </div>
      </aside>

      <div>
        <div class="list-header">
          <span id="jobCount"></span>
          <select id="fSort" onchange="renderJobs()">
            <option value="">默认排序</option>
            <option value="distance">距离最近优先</option>
            <option value="pay">时薪最高优先</option>
          </select>
        </div>
        <div id="jobList" class="job-list"></div>
      </div>
    </div>

    <div class="section-title">我的报名</div>
    <div id="myApplications"></div>
  </section>

  <!-- ============ SHOP VIEW ============ -->
  <section id="view-shop" class="view">
    <div class="hero-band">
      <div class="hero-band-inner">
        <h1>周末临时缺人手？发布岗位，让附近学生来接单</h1>
        <p>填写用工时间、时薪与人数要求，1 分钟发布，实时查看报名情况并确认用工</p>
      </div>
    </div>

    <div class="panel">
      <h3>发布新岗位</h3>
      <form onsubmit="postJob(event)">
        <div class="form-grid">
          <div class="field"><label>商家名称</label><input id="jShop" required placeholder="例如：南街奶茶铺"></div>
          <div class="field"><label>岗位名称</label><input id="jTitle" required placeholder="例如：周六收银兼打包"></div>
          <div class="field"><label>工作日期</label>
            <select id="jPeriod" required>
              <option value="">请选择</option>
              <option value="周末">周末</option>
              <option value="周内">周内</option>
            </select>
          </div>
          <div class="field"><label>每天工作时长（小时）</label><input id="jHours" type="number" required placeholder="例如 4"></div>
          <div class="field"><label>所在大学</label>
            <select id="jArea" required>
              <option value="">请选择</option>
              <option>Monash University · Clayton</option>
              <option>Monash University · Caulfield</option>
              <option>University of Melbourne · Parkville</option>
              <option>RMIT University · City</option>
              <option>Deakin University · Burwood</option>
              <option>La Trobe University · Bundoora</option>
            </select>
          </div>
          <div class="field"><label>距校区距离 (公里)</label><input id="jDist" type="number" step="0.1" required placeholder="例如 0.8"></div>
          <div class="field"><label>时薪 (AUD)</label><input id="jPay" type="number" required placeholder="例如 30"></div>
          <div class="field"><label>需求人数</label><input id="jNeed" type="number" required placeholder="例如 2"></div>
          <div class="field"><label>岗位分类</label>
            <select id="jCat" required>
              <option value="">请选择</option>
              <option value="🍜">餐饮</option>
              <option value="🛍️">零售</option>
              <option value="🎪">活动</option>
              <option value="📦">搬运/打包</option>
              <option value="📖">家教/辅导</option>
              <option value="🗂️">其他</option>
            </select>
          </div>
          <div class="field"><label>岗位标签（逗号分隔）</label><input id="jTags" placeholder="收银,英语沟通"></div>
          <div class="field full"><label>岗位说明</label><textarea id="jDesc" placeholder="简单说明工作内容、要求"></textarea></div>
        </div>
        <button class="submit-btn" type="submit">发布岗位</button>
      </form>
    </div>

    <div class="section-title">我发布的岗位</div>
    <div id="myPosted"></div>
  </section>

</main>

<footer>拼周末 · 原型 Demo — 数据保存于本地浏览器，用于演示产品流程</footer>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Data layer (localStorage as mock backend) ---------------- */
const LS_KEY = 'pinzhoumo_jobs_v4';
const LS_APP = 'pinzhoumo_apps_v4';

const CATS = [
  {icon:'🍜', label:'餐饮'},
  {icon:'🛍️', label:'零售'},
  {icon:'🎪', label:'活动'},
  {icon:'📦', label:'搬运/打包'},
  {icon:'📖', label:'家教/辅导'},
  {icon:'🗂️', label:'其他'},
];

function seedIfEmpty(){
  if(!localStorage.getItem(LS_KEY)){
    const seed = [
      {id:1, shop:'南街奶茶铺', title:'周末饮品制作+收银', period:'周末', hours:4, area:'Monash University · Clayton', distance:0.4, pay:29, need:2, cat:'🍜', tags:['收银'], desc:'负责饮品制作与收银，需能用中文和英文简单沟通。', urgent:true},
      {id:2, shop:'城南书店市集', title:'周末市集摊位帮手', period:'周末', hours:6, area:'RMIT University · City', distance:1.6, pay:27, need:3, cat:'🎪', tags:['搬运'], desc:'协助摆摊、介绍商品、简单收银，需要能搬箱子。', urgent:false},
      {id:3, shop:'Clayton炸鸡店', title:'外卖打包+前台', period:'周末', hours:5, area:'Monash University · Clayton', distance:0.9, pay:31, need:1, cat:'🍜', tags:['外卖'], desc:'高峰期打包外卖订单，动作要快。', urgent:true},
      {id:4, shop:'社区宠物展', title:'活动引导志愿岗（有偿）', period:'周末', hours:3, area:'La Trobe University · Bundoora', distance:2.3, pay:26, need:4, cat:'🎪', tags:['引导'], desc:'展会现场引导观众、维持秩序，需要形象整洁、态度友善。', urgent:false},
      {id:5, shop:'Caulfield花店', title:'周末花束打包', period:'周末', hours:2, area:'Monash University · Caulfield', distance:0.6, pay:28, need:1, cat:'📦', tags:['打包'], desc:'协助包装花束，需要细心，有插花经验优先。', urgent:false},
      {id:6, shop:'考拉自习室', title:'周内晚间一对一陪学', period:'周内', hours:2, area:'University of Melbourne · Parkville', distance:1.1, pay:33, need:2, cat:'📖', tags:['英语沟通'], desc:'陪同中学生完成作业，需耐心。', urgent:true},
      {id:7, shop:'毛孩子寄养屋', title:'周内遛狗+喂食', period:'周内', hours:1, area:'Deakin University · Burwood', distance:2.8, pay:25, need:2, cat:'🗂️', tags:['户外'], desc:'负责遛狗、喂食、简单清洁，需喜欢动物。', urgent:false},
    ];
    localStorage.setItem(LS_KEY, JSON.stringify(seed));
  }
  if(!localStorage.getItem(LS_APP)){
    localStorage.setItem(LS_APP, JSON.stringify([]));
  }
}
function getJobs(){ return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
function saveJobs(j){ localStorage.setItem(LS_KEY, JSON.stringify(j)); }
function getApps(){ return JSON.parse(localStorage.getItem(LS_APP) || '[]'); }
function saveApps(a){ localStorage.setItem(LS_APP, JSON.stringify(a)); }

seedIfEmpty();

/* ---------------- Role switch ---------------- */
function setRole(role){
  document.getElementById('view-student').classList.toggle('active', role==='student');
  document.getElementById('view-shop').classList.toggle('active', role==='shop');
  document.getElementById('btnStudent').classList.toggle('active', role==='student');
  document.getElementById('btnShop').classList.toggle('active', role==='shop');
  document.getElementById('campusSwitch').style.display = role==='student' ? '' : 'none';
  if(role==='student'){ renderJobs(); renderMyApplications(); }
  else { renderMyPosted(); }
}
function onCampusChange(){ renderJobs(); }

/* ---------------- Category grid (金刚区) ---------------- */
let activeCat = '';
function renderCatGrid(){
  const box = document.getElementById('catGrid');
  box.innerHTML = CATS.map(c=>
    `<button type="button" class="cat-item ${c.icon===activeCat?'active':''}" onclick="toggleCat('${c.icon}')">
      <span class="ic">${c.icon}</span><span>${c.label}</span>
    </button>`
  ).join('');
}
function toggleCat(icon){
  activeCat = (activeCat===icon) ? '' : icon;
  renderCatGrid();
  renderJobs();
}

/* ---------------- Render job list (student) ---------------- */
function renderJobs(){
  const jobs = getJobs();
  const apps = getApps();
  const campus = document.getElementById('campusSwitch').value;
  const fPeriod = document.getElementById('fPeriod').value;
  const fHours = document.getElementById('fHours').value;
  const fPay = parseFloat(document.getElementById('fPay').value) || 0;
  const fSort = document.getElementById('fSort').value;

  let filtered = jobs.filter(j=>{
    if(j.area !== campus) return false;
    if(fPeriod && j.period!==fPeriod) return false;
    if(fHours){
      const max = parseFloat(fHours);
      if(max===2 && j.hours>2) return false;
      if(max===4 && !(j.hours>2 && j.hours<=4)) return false;
      if(max===6 && !(j.hours>4 && j.hours<=6)) return false;
      if(max===99 && !(j.hours>6)) return false;
    }
    if(fPay && j.pay < fPay) return false;
    if(activeCat && j.cat!==activeCat) return false;
    return true;
  });

  if(fSort==='distance') filtered = filtered.slice().sort((a,b)=>a.distance-b.distance);
  if(fSort==='pay') filtered = filtered.slice().sort((a,b)=>b.pay-a.pay);

  document.getElementById('jobCount').textContent = `为你找到 ${filtered.length} 个岗位`;

  document.getElementById('statJobs').textContent = jobs.length;
  document.getElementById('statShops').textContent = new Set(jobs.map(j=>j.shop)).size;

  const list = document.getElementById('jobList');
  if(filtered.length===0){
    list.innerHTML = `<div class="empty">没有符合条件的岗位，试试调整筛选条件</div>`;
    return;
  }

  list.innerHTML = filtered.map(j=>{
    const already = apps.some(a=>a.jobId===j.id);
    const filled = apps.filter(a=>a.jobId===j.id && a.status==='confirmed').length;
    const remain = j.need - filled;
    const full = remain <= 0;
    return `
      <div class="job-card">
        <div class="info">
          <div class="title-row">
            <span style="font-size:18px;">${j.cat}</span>
            <h4>${j.title}</h4>
            ${j.urgent ? '<span class="urgent-pill">急招</span>' : ''}
            ${!full && remain<=1 ? `<span class="urgent-pill">仅剩${remain}人</span>` : ''}
          </div>
          <div class="job-meta">
            <span>🕒 ${j.period} · 每天${j.hours}小时</span>
            <span>📍 距你 ${j.distance}km</span>
            <span>👥 需求 ${j.need} 人</span>
          </div>
          <div class="job-tags">${j.tags.map(t=>`<span class="tag-pill">${t}</span>`).join('')}</div>
          <div class="shop-line">${j.shop} · ${j.desc}</div>
        </div>
        <div class="side">
          <div class="pay"><b>$${j.pay}</b><span class="u">/小时</span></div>
          <button class="apply" ${already||full?'disabled':''} onclick="applyJob(${j.id})">
            ${full ? '已招满' : (already ? '已报名' : '一键报名')}
          </button>
        </div>
      </div>`;
  }).join('');
}

function applyJob(jobId){
  const apps = getApps();
  if(apps.some(a=>a.jobId===jobId)){ return; }
  apps.push({id:Date.now(), jobId, status:'pending'});
  saveApps(apps);
  showToast('报名成功，等待商家确认');
  renderJobs();
  renderMyApplications();
}

function renderMyApplications(){
  const apps = getApps();
  const jobs = getJobs();
  const box = document.getElementById('myApplications');
  if(apps.length===0){
    box.innerHTML = `<div class="empty">还没有报名记录，去上面看看有什么岗位吧</div>`;
    return;
  }
  box.innerHTML = apps.map(a=>{
    const job = jobs.find(j=>j.id===a.jobId);
    if(!job) return '';
    return `
      <div class="posted-card">
        <div class="top">
          <div>
            <h4 style="margin:0 0 4px; font-size:14.5px;">${job.cat} ${job.title} · ${job.shop}</h4>
            <div class="job-meta"><span>🕒 ${job.period} · 每天${job.hours}小时</span><span>📍 距你 ${job.distance}km</span><span style="color:var(--red); font-weight:700;">$${job.pay}/时</span></div>
          </div>
          <span class="status-pill ${a.status==='confirmed'?'status-confirmed':'status-pending'}">
            ${a.status==='confirmed' ? '已确认' : '待商家确认'}
          </span>
        </div>
      </div>`;
  }).join('');
}

/* ---------------- Shop: post job ---------------- */
function postJob(e){
  e.preventDefault();
  const jobs = getJobs();
  const tags = document.getElementById('jTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const newJob = {
    id: Date.now(),
    shop: document.getElementById('jShop').value,
    title: document.getElementById('jTitle').value,
    period: document.getElementById('jPeriod').value,
    hours: parseFloat(document.getElementById('jHours').value),
    area: document.getElementById('jArea').value,
    distance: parseFloat(document.getElementById('jDist').value),
    pay: parseFloat(document.getElementById('jPay').value),
    need: parseInt(document.getElementById('jNeed').value),
    cat: document.getElementById('jCat').value || '🍜',
    tags: tags.length ? tags : ['其他'],
    desc: document.getElementById('jDesc').value || '暂无补充说明',
    urgent: false
  };
  jobs.unshift(newJob);
  saveJobs(jobs);
  e.target.reset();
  showToast('岗位已发布');
  renderMyPosted();
}

function renderMyPosted(){
  const jobs = getJobs();
  const apps = getApps();
  const box = document.getElementById('myPosted');
  if(jobs.length===0){
    box.innerHTML = `<div class="empty">还没有发布岗位</div>`;
    return;
  }
  box.innerHTML = jobs.map(j=>{
    const jobApps = apps.filter(a=>a.jobId===j.id);
    return `
      <div class="posted-card">
        <div class="top">
          <div>
            <h4 style="margin:0 0 4px; font-size:14.5px;">${j.cat} ${j.title}</h4>
            <div class="job-meta"><span>🕒 ${j.period} · 每天${j.hours}小时</span><span>📍 ${j.area} · 距校区${j.distance}km</span><span style="color:var(--red);font-weight:700;">$${j.pay}/时</span><span>👥 需求 ${j.need}</span></div>
          </div>
        </div>
        ${jobApps.length===0
          ? `<div style="font-size:12px;color:var(--ink-45);padding-top:8px;">暂无学生报名</div>`
          : jobApps.map(a=>`
            <div class="applicant-row">
              <span>报名学生 #${String(a.id).slice(-4)}</span>
              ${a.status==='confirmed'
                ? `<span class="status-pill status-confirmed">已确认</span>`
                : `<button class="confirm-btn" onclick="confirmApp(${a.id})">确认用工</button>`}
            </div>`).join('')}
      </div>`;
  }).join('');
}

function confirmApp(appId){
  const apps = getApps();
  const a = apps.find(x=>x.id===appId);
  if(a){ a.status='confirmed'; saveApps(apps); showToast('已确认该学生用工'); renderMyPosted(); }
}

/* ---------------- Toast ---------------- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- Init ---------------- */
renderCatGrid();
renderJobs();
renderMyApplications();
renderMyPosted();
</script>

</body>
